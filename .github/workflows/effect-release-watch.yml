name: effect-release-watch

# Once a day, and on demand: if npm's `latest` effect is newer than the newest committed
# snapshot, record the release (snapshot, generated changes file, plugin patch bump,
# changelog section) on a branch named for it and open a pull request into main.
# This workflow never pushes to main.
#
# Two repository facts to know:
#  - Opening the pull request needs Settings > Actions > General > Workflow permissions >
#    "Allow GitHub Actions to create and approve pull requests". The step below says so when
#    it fails without it; the branch is already pushed by then.
#  - Events caused by GITHUB_TOKEN do not start other workflows (workflow_dispatch and
#    repository_dispatch excepted), so the pull request opened here does not get its `ci`
#    run on its own. Close and reopen the PR as a maintainer to start it.
#    (https://docs.github.com/en/actions/concepts/security/github_token)

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: effect-release-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
      - name: Record a new effect release, if there is one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          python3 tools/api-snapshot/api_snapshot.py watch | tee "$RUNNER_TEMP/watch.log"
          version="$(sed -n 's/^recorded: //p' "$RUNNER_TEMP/watch.log")"
          if [ -z "$version" ]; then
            echo "Nothing to record."
            exit 0
          fi
          branch="chore/effect-$version"

          # A pull request (open or closed) or a branch already exists for this release: leave it be.
          if [ -n "$(gh pr list --state all --head "$branch" --json number --jq '.[].number')" ]; then
            echo "A pull request for $branch already exists; nothing more to do."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::warning::Branch $branch exists with no pull request, most likely because an earlier run could not open one (Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests'). Open the pull request from the branch by hand, or delete the branch and re-run."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add api skills .claude-plugin CHANGELOG.md
          git commit -m "chore: record the effect@$version release" \
            -m "Generated by tools/api-snapshot/api_snapshot.py watch: the snapshot, the changes file under skills/effect-v4/reference/changes/, the plugin patch bump and its changelog section."
          git push origin "$branch"

          body="Generated by the effect-release-watch workflow: npm's latest effect is $version.

          - api/effect/$version.json: the snapshot of the release
          - skills/effect-v4/reference/changes/$version.md: what it removed or changed, unstable exports first, stable ones separately
          - the plugin's patch version and a CHANGELOG section for it

          Read the changes file before merging: a removed or changed stable export is a semver break. Merging into $DEFAULT_BRANCH ships the new version. If the ci checks did not start on this pull request, close and reopen it (pull requests opened with GITHUB_TOKEN do not trigger them)."
          if ! gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
               --title "chore: record the effect@$version release" --body "$body"; then
            echo "::error::Branch $branch is pushed but the pull request was not opened. If the message above says GitHub Actions is not permitted to create pull requests, turn on Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests', then re-run this workflow after deleting the branch, or open the pull request from $branch by hand."
            exit 1
          fi
