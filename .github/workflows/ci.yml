name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frontmatter, no leaked identifiers, TOC links
        run: bash scripts/check.sh

  version-bump:
    name: skills changed ⇒ version bumped
    # Only a change reaching main owes the bump; a PR into any other base is exempt.
    if: github.event_name == 'push' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: A shipped change must move the version
        run: |
          set -euo pipefail
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}"
          git rev-parse --verify "$base" >/dev/null 2>&1 || { echo "first commit — skipping"; exit 0; }
          changed="$(git diff --name-only "$base" HEAD | grep -E '^(skills/|\.claude-plugin/|README\.md|LICENSE)' || true)"
          [ -n "$changed" ] || { echo "no shipped content changed"; exit 0; }
          was="$(git show "$base:.claude-plugin/plugin.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' || echo "")"
          now="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          echo "version: $was -> $now"
          [ "$was" != "$now" ] || { echo "::error::skills changed but version is still $now"; exit 1; }
          grep -qF "## $now" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $now' entry"; exit 1; }
